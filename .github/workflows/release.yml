name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build app
        run: ./scripts/build-app.sh "$VERSION"

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent LiteLLMBar.app "LiteLLMBar-$VERSION.zip"
          echo "SHA256=$(shasum -a 256 "LiteLLMBar-$VERSION.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/LiteLLMBar-$VERSION.zip" \
            --title "LiteLLM Bar $VERSION" --generate-notes

      - name: Update Homebrew cask
        run: |
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/update-cask.sh "$VERSION" "$SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/litellm-bar.rb
          git commit -m "cask: litellm-bar $VERSION"
          git push origin main
