name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # Entra ID (OIDC) sign-in for Marketplace publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VSIX=litellm-usage-$VERSION.vsix" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --no-dependencies -o "$VSIX"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "LiteLLM Usage $VERSION" --generate-notes

      # Preferred: Microsoft Entra ID via OIDC (no long-lived secret). Enabled when the
      # AZURE_CLIENT_ID and AZURE_TENANT_ID repository variables are set.
      - name: Azure login (Entra ID)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Visual Studio Marketplace
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            npx vsce publish --no-dependencies --azure-credential --packagePath "$VSIX"
          elif [ -n "$VSCE_PAT" ]; then
            # Legacy global PAT — Azure DevOps retires these on 2026-12-01.
            npx vsce publish --no-dependencies --packagePath "$VSIX"
          else
            echo "::warning::No Marketplace credentials configured — upload $VSIX manually at https://marketplace.visualstudio.com/manage"
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not set — skipping Open VSX"
            exit 0
          fi
          npx ovsx publish "$VSIX" -p "$OVSX_PAT"
